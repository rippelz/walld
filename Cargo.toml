[workspace]
members = [".", "crates/wallengine-scene", "crates/wallengine-we", "crates/wallstudio"]
resolver = "2"

[package]
name = "walld"
version = "0.1.0"
edition = "2021"
description = "Wayland wallpaper engine daemon — native + Wallpaper Engine content"
license = "MIT"

[[bin]]
name = "walld"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-sys = { version = "0.31", features = ["client", "egl", "dlopen"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
calloop = { version = "0.14", default-features = false, features = ["signals"] }
calloop-wayland-source = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime", "auto-color"] }
thiserror = "1"
nix = { version = "0.28", default-features = false, features = ["time", "process", "fs", "signal"] }
wallengine-scene = { path = "crates/wallengine-scene" }
wallengine-we = { path = "crates/wallengine-we" }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
strip = true
