[package]
name = "wallstudio"
version = "0.1.0"
edition = "2021"
description = "iced gallery / control app for the walld wallpaper engine"
license = "MIT"

[[bin]]
name = "wallstudio"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
wallengine-scene = { path = "../wallengine-scene" }
serde_json = "1"
