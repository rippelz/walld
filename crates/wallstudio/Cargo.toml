[package]
name = "wallstudio"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine–style gallery for the walld engine"
license = "MIT"

[[bin]]
name = "wallstudio"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }
wallengine-scene = { path = "../wallengine-scene" }
serde_json = "1"
