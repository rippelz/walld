[package]
name = "wallengine-we"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine package formats: workshop scan, PKGV, TEX, project.json"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
