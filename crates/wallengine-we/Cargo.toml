[package]
name = "wallengine-we"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine formats + scene runtime for walld (independent of linux-wallpaperengine)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tga"] }
lz4_flex = "0.11"
ab_glyph = "0.2"
libc = "0.2"
glam = "0.25"
boa_engine = "0.20"

[dev-dependencies]
env_logger = "0.11"
